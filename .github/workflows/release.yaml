# Topic workflow: tag and publish a GitHub release as neteye-steward when the
# plugin version changes on main.
#
# .claude-plugin/plugin.json is the source of truth for the version. Claude Code
# caches an installed plugin by this version, so users only get an update when
# it changes. To release:
#
#   1. Bump `version` in .claude-plugin/plugin.json through a pull request.
#   2. Merge it. The workflow does the rest.
#
# Behaviour:
#   - Runs only for pushes to main that touch .claude-plugin/plugin.json.
#   - Creates the tag `v<version>` on the pushed commit and a GitHub release
#     with notes generated by GitHub from the pull requests merged since the
#     previous release.
#   - Does nothing, successfully, when the tag and the release already exist, so
#     an edit to plugin.json that keeps the same version does not release again.
#   - Is safe to re-run: a missing tag or a missing release is created, one that
#     exists is left alone.
#   - Tag and release are created with the NetEye Steward GitHub App token. The
#     tag is created through the Git Data API with no custom tagger, so GitHub
#     signs it on the App's behalf and shows it as Verified.
#
# Secrets: the workflow uses the NETEYE_APP_ID variable and the
#   NETEYE_APP_PRIVATE_KEY secret of the neteye steward GitHub App.

name: Release

on:
  push:
    branches:
      - main
    paths:
      - .claude-plugin/plugin.json

permissions:
  contents: read

# One release at a time. A second run queues behind the first and never
# cancels a release that is already tagging.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.NETEYE_APP_ID }}
          private-key: ${{ secrets.NETEYE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read plugin version
        id: version
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail

          version="$(jq -er '.version' .claude-plugin/plugin.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$version' in .claude-plugin/plugin.json is not a SemVer version like 1.2.3"
            exit 1
          fi

          tag_exists=false
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" >/dev/null 2>&1; then
            tag_exists=true
          fi

          release_exists=false
          if gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          fi

          {
            echo "version=$version"
            echo "tag_exists=$tag_exists"
            echo "release_exists=$release_exists"
          } >> "$GITHUB_OUTPUT"

      - name: Create signed release tag
        if: steps.version.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="v${VERSION}" \
            -f message="v${VERSION}" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" \
            -f sha="$tag_sha"

      - name: Publish GitHub release
        if: steps.version.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v${VERSION}" \
            --generate-notes
